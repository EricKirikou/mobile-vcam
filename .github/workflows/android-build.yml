name: Build Android Package (APK)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p ../packages/android
          cp app/build/outputs/apk/debug/*.apk ../packages/android/app-debug.apk

      - name: Build Android Release APK
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../packages/android
          cp app/build/outputs/apk/release/*.apk ../packages/android/app-release.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileVirtualCamera-Android-APK
          path: packages/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: packages/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

