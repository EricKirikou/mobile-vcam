name: Build iOS Package (IPA)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - development
          - ad-hoc
          - app-store

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_PP: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'unsigned' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/MobileVirtualCamera/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup Code Signing
        if: env.APPLE_CERT != '' && env.APPLE_PP != '' && env.BUILD_TYPE != 'unsigned'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'actions-runner-temp' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Unsigned IPA (For AltStore / Sideloadly / Test Devices)
        if: env.APPLE_CERT == '' || env.BUILD_TYPE == 'unsigned'
        run: |
          cd ios/MobileVirtualCamera
          echo "==> Building app without code signing for sideloading/testing..."
          
          xcodebuild clean build \
            -project MobileVirtualCamera.xcodeproj \
            -scheme MobileVirtualCamera \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "MobileVirtualCamera.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: MobileVirtualCamera.app not found in build directory!"
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          
          cd build
          zip -r -q MobileVirtualCamera.ipa Payload
          cd ../../..
          
          mkdir -p packages/ios
          cp ios/MobileVirtualCamera/build/MobileVirtualCamera.ipa packages/ios/
          echo "Created packages/ios/MobileVirtualCamera.ipa"

      - name: Build & Export Signed IPA
        if: env.APPLE_CERT != '' && env.BUILD_TYPE != 'unsigned'
        run: |
          chmod +x installers/ios/build-ipa.sh
          ./installers/ios/build-ipa.sh
          mkdir -p packages/ios
          cp ios/MobileVirtualCamera/build/IPA/*.ipa packages/ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileVirtualCamera-iOS-IPA
          path: packages/ios/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: packages/ios/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

